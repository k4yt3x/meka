[package]
name = "meka"
version = "0.86.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "A general-purpose AI agent harness"
repository = "https://github.com/k4yt3x/meka"

[features]
default = ["serve"]
mock-provider = []
serve = ["dep:axum", "dep:tower-http", "dep:utoipa"]

[dependencies]
agent-client-protocol = { version = "3.5", features = ["unstable_end_turn_token_usage", "unstable_session_fork"] }
ansi-to-tui = "8"
anyhow = "1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
croner = "4"
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
dirs = "7"
eventsource-stream = "0.2"
fast_html2md = "0.0"
futures = "0.3"
getrandom = { version = "0.4", features = ["std"] }
glob = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
hmac = "0.13.0"
humantime-serde = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
infer = { version = "0.22", default-features = false }
open = "5"
percent-encoding = "2"
pulldown-cmark = { version = "0.13.5", default-features = false }
ratatui = "0.30"
ratatui-textarea = "0.9"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query", "stream", "gzip", "deflate", "brotli", "cookies"] }
rmcp = { version = "3.5", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "auth-client-credentials-jwt"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
similar = "2"
strsim = "0.11"
subtle = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rusqlite = "0.8"
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1.1"
toml_edit = "0.25"
tower-http = { version = "0.7", features = ["cors", "limit", "trace"], optional = true }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"], optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
yaml_serde = "0.10.7"
zune-core = "0.5"
zune-jpeg = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
http = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
vt100 = "0.16"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug"] }

[lints.clippy]
await_holding_lock = "deny"
expect_used = "warn"
indexing_slicing = "warn"
match_wildcard_for_single_variants = "warn"
panic = "warn"
redundant_clone = "warn"
result_large_err = "allow"
significant_drop_tightening = "warn"
uninlined_format_args = "warn"
unreachable = "warn"
unused_async = "warn"
unwrap_used = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
