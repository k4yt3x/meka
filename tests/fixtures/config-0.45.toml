# A 0.45 config.toml, kept as the fixture `scripts/migrate-0.45-to-0.46.py` is run against.
default_provider = "work"

[providers.work]
type = "claude-subscription"
model = "claude-opus-5"   # pinned deliberately
context_window = 200000
redact_thinking = false
device_id = "0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0"

[providers.codex]
type = "chatgpt-subscription"
client_id = "app_example"
oauth_token_url = "https://auth.example.com/oauth/token"
model = "gpt-5.6-sol"

[providers.local]
type     = "openai-chat-completions"
base_url = "http://localhost:11434/v1"
model    = "llama3"

[permissions]
default = "ask"
enabled = ["read", "ask", "unrestricted"]

[display]
stream = true

[web]
request_timeout_seconds = 60   # slow corporate proxy
connect_timeout_seconds = 0

[session]
retention_days = 30

[thinking]
budget_tokens = 20000

[mcp]
strict = true
grace_seconds = 5
connect_timeout_seconds = 45

[[mcp.servers]]
name = "ida"
transport = "stdio"
command = "ida-mcp"
